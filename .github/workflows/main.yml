name: Build Web-to-Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & build web app
        run: |
          npm install
          npm run build

      - name: Wrap with Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Forex Journal" "com.hcollins.forexjournal" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Keystore & Build Signed APK
        run: |
          cd android
          chmod +x gradlew
          keytool -genkey -v -keystore release.keystore -alias forexjournal -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=ForexJournal, OU=Dev, O=Hcollins, L=Kampala, S=Central, C=UG"
          ./gradlew assembleRelease
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -n 1)/apksigner sign --ks release.keystore --ks-pass pass:password123 --key-pass pass:password123 --out app/build/outputs/apk/release/ForexJournal-Signed.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ForexJournal-Signed-APK
          path: android/app/build/outputs/apk/release/ForexJournal-Signed.apk
